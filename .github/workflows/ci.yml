name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Mozilla 的 add-on 檢查（manifest 欄位、最低版本、不安全的 API 用法）。目前 0 個錯誤；
      # 警告是 react-dom 內部的 innerHTML（見 README 的 AMO 說明），不使 CI 失敗。
      - run: pnpm --filter @adorable/extension-firefox lint
      - run: pnpm --filter @adorable/extension-firefox package
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: apps/extension/dist
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-addon
          path: apps/extension-firefox/web-ext-artifacts/*.zip
